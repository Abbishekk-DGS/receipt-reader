[project]
name = "receipt-reader"
version = "0.1.0"
description = "Receipts and invoices to validated JSON, offline: ONNX OCR, layout-aware line reconstruction, schema-constrained LLM extraction, and arithmetic checks with an automatic repair loop."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abbishekk DGS" }]
requires-python = ">=3.11"
dependencies = ["rapidocr-onnxruntime>=1.3", "pydantic>=2.6", "httpx>=0.27", "pillow>=10", "pypdfium2>=4.30"]

[project.urls]
Homepage = "https://abbishekkdgs.tech"
Repository = "https://github.com/Abbishekk-DGS/receipt-reader"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
receipt-reader = "receipt_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_reader"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
